<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letter preview, original layout: Deep navy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{position:relative;width:390px;height:844px;box-sizing:border-box;background:#FBFBFA;color:#121316;font-family:'Instrument Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.disp{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;letter-spacing:-0.02em;margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5B5F68}
.muted{color:#5B5F68}
.dots span{animation:blink 1.4s infinite;opacity:.2}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{40%{opacity:1}}
.stages{display:flex;gap:6px;align-items:center;justify-content:center;padding:8px 0 0}
.sd{width:26px;height:26px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sd i{display:block;width:8px;height:8px;border-radius:50%;background:#D6D8DE}
.sd.on i{background:#2B4BFF;width:20px;border-radius:4px}
.desk{flex-grow:1;display:flex;flex-direction:column;padding:12px 24px 22px;gap:12px;min-height:0}
.brief{font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:21px;line-height:1.42;letter-spacing:-0.015em;margin:0}
.ans{font-weight:700;color:#2B4BFF;border-bottom:3px solid #2B4BFF;line-height:1.2}
.blank{display:inline-block;min-width:80px;font-weight:700;color:#E8461A;border-bottom:3px solid #E8461A;line-height:1.2}
.chip{border:1.5px solid #D6D8DE;background:#FFFFFF;border-radius:999px;padding:9px 15px;font:inherit;font-size:15px;color:#121316;min-height:44px}
.chip.on{background:#121316;border-color:#121316;color:#FFFFFF}
.prev{margin:16px 16px 0;background:#1B2240;color:#FFFFFF;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;height:300px;box-sizing:border-box}
.status{display:flex;align-items:center;gap:9px;min-height:24px}
.ico{width:28px;height:28px;border-radius:8px;background:rgba(255,138,92,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.to{font-size:15px;line-height:1.35;color:rgba(255,255,255,.9)}
.to b{font-weight:600;color:#FFFFFF}
.it{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
.gl{display:block;height:9px;border-radius:5px;background:rgba(255,255,255,.12);width:85%}
.gl.short{width:55%;margin-top:6px}
.ghostrow{padding:9px 0 7px;border-top:1px solid rgba(255,255,255,.12)}
.ps{font-size:14px;line-height:1.4;color:#FF9F7A}
</style>
</helmet>
<div class="ph">
<div class="prev">
<div class="status"><span class="ico"><sc-if value="{{isEnvelope}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF9F7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></sc-if><sc-if value="{{isPencil}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF9F7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg></sc-if><sc-if value="{{isTray}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF9F7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2-7h12l2 7"/><path d="M4 13v5h16v-5h-5l-1 2h-4l-1-2H4z"/></svg></sc-if><sc-if value="{{isTruck}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF9F7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg></sc-if></span><span class="mono" style="color: rgba(255,255,255,.62)">{{status}}</span><sc-if value="{{working}}" hint-placeholder-val="{{ true }}"><span class="mono dots" style="color: rgba(255,255,255,.62)"><span>.</span><span>.</span><span>.</span></span></sc-if><sc-if value="{{hasWhen}}" hint-placeholder-val="{{ false }}"><span class="mono" style="color: #FF9F7A; margin-left: auto">{{when}}</span></sc-if></div>
<span class="to">To <b>{{to}}</b></span>
<div style="display: flex; flex-direction: column">
<sc-for list="{{items}}" as="it" hint-placeholder-count="2"><div class="it"><span class="mono" style="color: rgba(255,255,255,.62)">{{it.topic}}</span><span style="font-weight: 600; font-size: 15px">{{it.title}}</span></div></sc-for>
<sc-for list="{{ghost}}" as="g" hint-placeholder-count="1"><div class="ghostrow"><span class="gl"></span><span class="gl short"></span></div></sc-for>
</div>
<div style="flex-grow: 1"></div>
<span class="ps">{{ps}}</span>
</div>
<div class="stages" role="group" aria-label="Preview stages">
<sc-for list="{{stageDots}}" as="d" hint-placeholder-count="4"><button class="{{d.cls}}" aria-label="{{d.label}}" aria-pressed="{{d.on}}" onClick="{{d.pick}}"><i></i></button></sc-for>
</div>
<div class="desk">
<p class="brief">{{sentenceA}}<span class="ans">{{sentenceB}}</span>{{sentenceC}}<span class="blank">&#8202;</span>.</p>
<span class="mono">{{chipPrompt}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="o" hint-placeholder-count="4"><span class="{{o.cls}}">{{o.label}}</span></sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var STAGES = [
  { label: "Empty", status: "Finding you a fresh envelope", icon: "envelope", to: "you", toShort: "You", when: "", subject: "Your first letter", items: [], ps: "P.S. Hi. Tell me who you are and I'll start writing.", step: 0,
    a: "I'm ", b: "", c: "a ", prompt: "Pick one", chips: ["founder", "startup operator", "consultant", "investor"] },
  { label: "Drafting", status: "Drafting at the post office", icon: "pencil", to: "a founder who's into pricing", toShort: "A founder", when: "", subject: "Pricing, for a founder", items: [["Because you said “how Costco makes money”", "A piece on membership pricing"], ["Pricing", "How we priced our first B2B contract"]], ps: "P.S. A business-model nerd. Membership fees are my favourite magic trick too.", step: 2,
    a: "I'm ", b: "a founder", c: ". Send me more on ", prompt: "Here's what I heard. Tweak it.", chips: ["business models", "pricing", "hiring", "open source"] },
  { label: "Sorting", status: "Sorting 312 accounts from X", icon: "tray", to: "a founder who's into pricing and hiring", toShort: "A founder", when: "", subject: "Pricing and hiring, for a founder", items: [["Because you said “how Costco makes money”", "A piece on membership pricing"], ["Pricing · via X", "How we priced our first B2B contract"], ["Hiring · new source", "Hiring your first engineer without a recruiter"]], ps: "P.S. 312 accounts. I'll keep the good ones and quietly lose the rest.", step: 3,
    a: "I'm a founder. Send me more on ", b: "pricing and hiring", c: ". I follow people on ", prompt: "Connect any, or skip", chips: ["Connect YouTube", "X · connected", "Connect Substack"] },
  { label: "Ready", status: "Out for delivery", icon: "truck", to: "a founder who's into pricing and hiring", toShort: "A founder", when: "Mon–Fri 7:30", subject: "Pricing and hiring, for a founder", items: [["Because you said “how Costco makes money”", "A piece on membership pricing"], ["Pricing · via X", "How we priced our first B2B contract"], ["Hiring · new source", "Hiring your first engineer without a recruiter"]], ps: "P.S. Arrives Monday 7:30. Shorter than your coffee, I promise.", step: 5,
    a: "I'm a founder… I follow people on ", b: "X", c: ". Send it ", prompt: "When should it arrive?", chips: ["weekday mornings", "at lunch", "Sunday mornings"] }
];
var STEPS = [["envelope", "Address"], ["note", "Listen"], ["pencil", "Draft"], ["tray", "Sort"], ["stamp", "Stamp"], ["truck", "Send"]];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { st: 2 }; }
  renderVals() {
    var s = this.state, self = this;
    var g = STAGES[s.st];
    var items = g.items.map(function (it, i) { return { topic: it[0], title: it[1], n: "0" + (i + 1) }; });
    var ghost = [];
    for (var i = items.length; i < 3; i++) ghost.push({ n: "0" + (i + 1) });
    var steps = STEPS.map(function (x, i) { return { label: x[1], key: x[0], cls: i < g.step ? "stp done" : i === g.step ? "stp now" : "stp", isEnvelope: x[0] === "envelope", isNote: x[0] === "note", isPencil: x[0] === "pencil", isTray: x[0] === "tray", isStamp: x[0] === "stamp", isTruck: x[0] === "truck" }; });
    return {
      stageDots: STAGES.map(function (x, i) { return { label: x.label, on: i === s.st, cls: i === s.st ? "sd on" : "sd", pick: function () { self.setState({ st: i }); } }; }),
      status: g.status, working: s.st < 3, to: g.to, toShort: g.toShort, when: g.when || "Not scheduled yet", hasWhen: !!g.when, subject: g.subject, ps: g.ps,
      items: items, ghost: ghost, hasItems: items.length > 0, noItems: items.length === 0,
      isEnvelope: g.icon === "envelope", isPencil: g.icon === "pencil", isTray: g.icon === "tray", isTruck: g.icon === "truck",
      steps: steps,
      sentenceA: g.a, sentenceB: g.b, sentenceC: g.c, chipPrompt: g.prompt,
      chips: g.chips.map(function (c, i) { return { label: c, cls: (s.st === 1 && i < 2) || c.indexOf("connected") >= 0 ? "chip on" : "chip" }; })
    };
  }
}
</script>
</body>
</html>
